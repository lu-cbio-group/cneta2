# Settings shared by all three run scripts (bin/run-*.sh), which source this
# file before anything else.
#
# This is a shell file, read by the scripts -- not by the programs -- so use
# shell syntax: no spaces around '='. The *.cfg files next to it are read by
# the programs themselves and use a different syntax.
#
# Each setting has the form  VAR="${VAR:-value}"  so that a value set in the
# environment wins over this file, e.g.
#
#     CNETA_SEED=42 bin/run-cnets.sh
#
# Keep that form when adding settings.

# Working directory for a pipeline run. run-cnets.sh writes its simulated data
# here; run-cnetml.sh and run-cnetmcmc.sh read their input from here and write
# their results alongside it. A relative path is relative to the directory you
# run the script from, not to the repository.
CNETA_OUT="${CNETA_OUT:-./example}"

# Random seed. Leave empty to draw a fresh seed for every run; the scripts
# write the seed they used at the top of their log file. Set a number to
# reproduce an earlier run.
CNETA_SEED="${CNETA_SEED:-}"
