[pytest]
# Note: the build-system tests live in build_system/, not build/ -- pytest's
# default norecursedirs skips any directory called "build", so tests there
# would be silently collected as zero tests.
testpaths = e2e build_system
python_files = test_*.py
python_functions = test_*

# Note: per-test timeouts are enforced by the `run` fixture in conftest.py
# via subprocess, not by pytest-timeout. That keeps the suite dependency-free
# and still catches the realistic failure mode -- a binary that hangs.

markers =
    slow: takes more than a few seconds - excluded from the default run
    build: configures and compiles the project from scratch

# Show why tests were skipped (usually: the binaries have not been built).
addopts = -ra --strict-markers
